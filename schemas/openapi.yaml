openapi: 3.1.0
info:
  title: GlobalEconomy API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Check API health
      responses: { '200': { description: API is ready } }
  /api/runs:
    post:
      summary: Create deterministic simulation run
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RunConfig' } } }
      responses: { '200': { description: Created run } }
    get:
      summary: List active runs and replay windows
      responses:
        '200':
          description: Active runs
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RunSummary' } } } }
  /api/runs/compare:
    post:
      summary: Compare metrics across runs
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompareRequest' } } }
      responses: { '200': { description: Comparison result } }
  /api/runs/{id}/start:
    post:
      summary: Start a simulation run
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Running status }, '404': { description: Run not found } }
  /api/runs/{id}/pause:
    post:
      summary: Pause a simulation run
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Paused status }, '404': { description: Run not found } }
  /api/runs/{id}/step:
    post:
      summary: Advance exactly one simulation tick
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Updated snapshot }, '404': { description: Run not found } }
  /api/runs/{id}/reset:
    post:
      summary: Reset a run to its initial state
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Reset status }, '404': { description: Run not found } }
  /api/runs/{id}/snapshot:
    get:
      summary: Get visual snapshot
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Snapshot } }
  /api/runs/{id}/history:
    get:
      summary: Get bounded local snapshot history
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Snapshot history } }
  /api/runs/{id}/metrics:
    get:
      summary: Get compact persisted metric history
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Metric points without visual agents
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MetricPoint' } } } }
  /api/runs/{id}/metrics.parquet:
    get:
      summary: Download compact metric history as Parquet
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Columnar metric history for DuckDB or notebooks
          content: { application/vnd.apache.parquet: { schema: { type: string, format: binary } } }
        '404': { description: Run not found }
  /api/runs/{id}/replay/{tick}:
    get:
      summary: Get an exact historical snapshot
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tick, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Historical snapshot }
        '410': { description: Tick is outside the replay window }
  /api/runs/{id}/compliance/{alert_id}/resolve:
    post:
      summary: Resolve an auditable AML or tax alert
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: alert_id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Updated snapshot }
        '409': { description: Alert is missing or already resolved }
  /api/runs/{id}/policy:
    post:
      summary: Apply monetary policy immediately
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PolicyConfig' } } }
      responses: { '200': { description: Updated snapshot } }
  /api/runs/{id}/policy/next:
    post:
      summary: Apply the next historical monetary policy
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Updated snapshot }, '409': { description: No pending policy } }
  /api/runs/{id}/policy-mode:
    post:
      summary: Select manual or automatic policy progression
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [manual, automatic] } } } } }
      responses: { '200': { description: Updated snapshot } }
  /api/runs/{id}/shock:
    post:
      summary: Inject a reproducible synthetic external shock
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, region, intensity]
              properties:
                kind: { type: string, enum: [shock_oferta, corrida_bancaria, burbuja_activos, crisis_sanitaria] }
                region: { type: integer, minimum: 0 }
                intensity: { type: number, minimum: 0, maximum: 0.8 }
      responses: { '200': { description: Updated snapshot }, '404': { description: Run not found }, '422': { description: Unsupported shock kind } }
  /api/runs/{id}/risk/countermeasure:
    post:
      summary: Apply the latest monetary risk countermeasure
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Updated snapshot }, '409': { description: No open risk } }
  /api/runs/{id}/events:
    get:
      summary: Get filtered economic events
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tick, in: query, schema: { type: integer, format: int64 } }
        - { name: type, in: query, schema: { type: string } }
        - { name: agent, in: query, schema: { type: integer, format: int64 } }
        - { name: region, in: query, schema: { type: integer } }
        - { name: risk, in: query, schema: { type: boolean } }
        - { name: min_amount, in: query, schema: { type: number } }
        - { name: max_amount, in: query, schema: { type: number } }
      responses: { '200': { description: Economic events } }
  /api/runs/{id}/transactions:
    get:
      summary: Get filtered institutional transactions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tick, in: query, schema: { type: integer, format: int64 } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: agent, in: query, schema: { type: integer, format: int64 } }
        - { name: region, in: query, schema: { type: integer } }
        - { name: min_amount, in: query, schema: { type: number } }
        - { name: max_amount, in: query, schema: { type: number } }
      responses:
        '200':
          description: Filtered transactions
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Transaction' } } } }
  /api/runs/{id}/stream:
    get:
      summary: Stream live snapshots, metrics, transactions and alerts over WebSocket
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '101': { description: WebSocket upgrade; messages use types snapshot, metric_update, transaction, alert and run_status } }
  /api/generations:
    post:
      summary: Create an in-memory Generations society; advance_to replays it deterministically to a tick
      requestBody: { content: { application/json: { schema: { type: object, properties: { config: { $ref: '#/components/schemas/GenConfig' }, advance_to: { type: integer, minimum: 0 } } } } } }
      responses: { '200': { description: Society created, content: { application/json: { schema: { type: object, required: [id, config_hash, snapshot], properties: { id: { type: string, format: uuid }, config_hash: { type: string }, snapshot: { $ref: '#/components/schemas/GenSnapshot' } } } } } } }
  /api/generations/{id}/step:
    post:
      summary: Advance a society 1 to 50 years and return every event produced
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { count: { type: integer, minimum: 1, maximum: 50, default: 1 } } } } } }
      responses: { '200': { description: Stepped, content: { application/json: { schema: { type: object, required: [snapshot, events], properties: { snapshot: { $ref: '#/components/schemas/GenSnapshot' }, events: { type: array, items: { $ref: '#/components/schemas/GenEvent' } } } } } } }, '404': { description: Unknown society; recreate it with advance_to } }
  /api/generations/{id}/reset:
    post:
      summary: Restart a society from year 0 with the same configuration
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Snapshot at year 0, content: { application/json: { schema: { $ref: '#/components/schemas/GenSnapshot' } } } }, '404': { description: Unknown society } }
  /api/generations/{id}/snapshot:
    get:
      summary: Current society snapshot (living citizens plus those who died in the last 3 years)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/GenSnapshot' } } } }, '404': { description: Unknown society } }
  /api/generations/{id}/person/{pid}:
    get:
      summary: A citizen with parent, children and ancestors up to the founder, alive or dead
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: pid, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Family view, content: { application/json: { schema: { type: object, required: [person, surname, children, ancestors], properties: { person: { $ref: '#/components/schemas/Citizen' }, surname: { type: string }, parent: { $ref: '#/components/schemas/Citizen' }, children: { type: array, items: { $ref: '#/components/schemas/Citizen' } }, ancestors: { type: array, items: { $ref: '#/components/schemas/Citizen' } } } } } } }, '404': { description: Unknown society or citizen } }
components:
  schemas:
    GenConfig:
      type: object
      properties:
        seed: { type: integer, format: int64, default: 42 }
        founders: { type: integer, minimum: 2, maximum: 60, default: 12 }
        max_population: { type: integer, minimum: 20, maximum: 2000, default: 300 }
        inheritance_tax: { type: number, minimum: 0, maximum: 1, default: 0 }
        capital_return: { type: number, minimum: 0, maximum: 0.1, default: 0.04 }
        max_ticks: { type: integer, minimum: 1, maximum: 2000, default: 400 }
    Citizen:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        lineage: { type: integer }
        parent: { type: integer, nullable: true }
        generation: { type: integer }
        age: { type: integer }
        alive: { type: boolean }
        died_tick: { type: integer, nullable: true }
        cause: { type: string, enum: [old_age, poverty], nullable: true }
        money: { type: number }
        delta: { type: number, description: Change in money during the last year }
        earned: { type: number, description: Lifetime wages plus returns }
        received: { type: number, description: Lifetime dowry, inheritances and public transfers }
        strategy: { type: string, enum: [saver, consumer, entrepreneur] }
        skill: { type: number }
        children: { type: array, items: { type: integer } }
        x: { type: number, description: 'Fixed lineage-layout position in [0,1]' }
        y: { type: number }
    GenEvent:
      type: object
      required: [kind, tick]
      description: 'Tagged by kind: birth (child, parent, lineage, dowry), death (id, lineage, age, cause, estate), inheritance (from, heirs, each, tax, to_state), redistribution (amount, recipients), extinction (lineage), collapse'
      properties:
        kind: { type: string, enum: [birth, death, inheritance, redistribution, extinction, collapse] }
        tick: { type: integer }
      additionalProperties: true
    GenSnapshot:
      type: object
      properties:
        tick: { type: integer }
        config: { $ref: '#/components/schemas/GenConfig' }
        config_hash: { type: string }
        finished: { type: boolean }
        citizens: { type: array, items: { $ref: '#/components/schemas/Citizen' } }
        lineages: { type: array, items: { type: object, properties: { id: { type: integer }, surname: { type: string }, alive: { type: integer }, ever: { type: integer }, wealth: { type: number }, share: { type: number }, extinct_tick: { type: integer, nullable: true } } } }
        events: { type: array, items: { $ref: '#/components/schemas/GenEvent' } }
        metrics: { type: object, properties: { tick: { type: integer }, population: { type: integer }, births: { type: integer }, deaths: { type: integer }, gini: { type: number }, top_10_share: { type: number }, mean_wealth: { type: number }, median_wealth: { type: number }, total_wealth: { type: number }, lineages_alive: { type: integer }, inherited_share: { type: number }, max_generation: { type: integer }, state_collected: { type: number } } }
        metric_history: { type: array, items: { type: object } }
    RunConfig:
      type: object
      required: [seed, model_version, agent_count, regions, ticks]
      properties:
        seed: { type: integer, format: int64 }
        model_version: { type: string }
        agent_count: { type: integer, minimum: 1 }
        regions: { type: integer, minimum: 1 }
        ticks: { type: integer, minimum: 1 }
        monetary_history: { type: array, items: { $ref: '#/components/schemas/MonetaryPolicy' } }
        historical_mode: { type: boolean, default: true }
        catastrophes: { type: boolean, default: false }
        policy_mode: { type: string, enum: [manual, automatic], default: automatic }
        institutions: { $ref: '#/components/schemas/InstitutionConfig' }
        scenario_config: { $ref: '#/components/schemas/ScenarioConfig' }
    RunSummary:
      type: object
      required: [run_id, status, tick, created_at, config_hash, history_ticks]
      properties:
        run_id: { type: string, format: uuid }
        status: { type: string }
        tick: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        config_hash: { type: string }
        history_ticks: { type: array, items: { type: integer, format: int64 } }
    CompareRequest:
      type: object
      required: [run_ids]
      properties:
        run_ids: { type: array, items: { type: string, format: uuid }, minItems: 1 }
        tick: { type: integer, format: int64 }
    Snapshot:
      type: object
      properties:
        tick: { type: integer }
        agents: { type: array, items: { type: object } }
        metrics: { $ref: '#/components/schemas/Metrics' }
        compliance_alerts: { type: array, items: { $ref: '#/components/schemas/ComplianceAlert' } }
        external_shocks: { type: array, items: { $ref: '#/components/schemas/ExternalShock' } }
    MetricPoint:
      type: object
      required: [tick, metrics]
      properties:
        tick: { type: integer, format: int64 }
        metrics: { $ref: '#/components/schemas/Metrics' }
    Metrics:
      type: object
      description: Compact aggregate indicators for a tick.
      required: [gdp, gini, unemployment, inflation, tax_revenue, trade_volume, money_supply, monetary_regime, bankruptcies, bank_concentration, regional_wealth_gap, social_mobility]
      properties:
        gdp: { type: number }
        gini: { type: number, minimum: 0, maximum: 1 }
        unemployment: { type: number, minimum: 0, maximum: 1 }
        inflation: { type: number }
        tax_revenue: { type: number }
        trade_volume: { type: number }
        alerts: { type: integer, format: int64 }
        mean_wealth: { type: number }
        money_supply: { type: number }
        interest_rate: { type: number }
        top_10_wealth_share: { type: number, minimum: 0, maximum: 1 }
        money_created_this_tick: { type: number }
        cumulative_money_created: { type: number }
        government_debt: { type: number }
        private_debt: { type: number }
        debt_created_this_tick: { type: number }
        monetary_regime: { type: string }
        wealth_shock: { type: number }
        adverse_events: { type: integer, format: int64 }
        open_risks: { type: integer, format: int64 }
        countermeasures: { type: integer, format: int64 }
        systemic_risk: { type: number, minimum: 0, maximum: 1 }
        security_level: { type: number, minimum: 0, maximum: 1 }
        aml_alerts: { type: integer, format: int64 }
        tax_alerts: { type: integer, format: int64 }
        bankruptcies: { type: integer, format: int64 }
        bank_concentration: { type: number, minimum: 0, maximum: 1 }
        regional_wealth_gap: { type: number, minimum: 0, maximum: 1 }
        social_mobility: { type: number, minimum: 0, maximum: 1 }
    PolicyConfig:
      type: object
      properties:
        income_tax_rate: { type: number }
        transfer_per_person: { type: number }
        base_interest_rate: { type: number }
        liquidity_injection: { type: number }
    ScenarioConfig:
      type: object
      required: [food_price, wage]
      properties:
        food_price: { type: number }
        wage: { type: number }
        initial_wealth: { type: number, default: 2500 }
        evolution: { type: boolean, default: false }
        shock_probability: { type: number, minimum: 0, maximum: 1, default: 0.02 }
        shock_intensity: { type: number, minimum: 0, maximum: 1, default: 0.18 }
        strategy_mutation_rate: { type: number, minimum: 0, maximum: 1, default: 0.02 }
    InstitutionConfig:
      type: object
      properties:
        company_count: { type: integer, minimum: 1, default: 80 }
        bank_count: { type: integer, minimum: 1, default: 8 }
        sector_count: { type: integer, minimum: 1, default: 6 }
    MonetaryPolicy:
      type: object
      required: [apply_tick, name, description, base_interest_rate, liquidity_injection]
      properties:
        apply_tick: { type: integer }
        name: { type: string }
        description: { type: string }
        base_interest_rate: { type: number }
        liquidity_injection: { type: number }
        government_debt_change: { type: number }
        private_credit_creation: { type: number }
        catastrophe: { type: boolean }
        optional: { type: boolean }
    Transaction:
      type: object
      required: [id, tick, from, to, kind, amount, region, reason]
      properties:
        id: { type: integer, format: int64 }
        tick: { type: integer, format: int64 }
        from: { type: integer, format: int64 }
        to: { type: integer, format: int64 }
        kind: { type: string }
        amount: { type: number }
        region: { type: integer }
        reason: { type: string }
    ComplianceAlert:
      type: object
      required: [id, tick, entity_id, category, severity, reason, related_transaction_ids, status]
      properties:
        id: { type: integer, format: int64 }
        tick: { type: integer, format: int64 }
        entity_id: { type: integer, format: int64 }
        category: { type: string, enum: [aml, tax_evasion] }
        severity: { type: number, minimum: 0, maximum: 1 }
        reason: { type: string }
        related_transaction_ids: { type: array, items: { type: integer, format: int64 } }
        status: { type: string, enum: [open, reviewed, resolved] }
    ExternalShock:
      type: object
      required: [id, tick, kind, region, intensity, reason]
      properties:
        id: { type: integer, format: int64 }
        tick: { type: integer, format: int64 }
        kind: { type: string }
        region: { type: integer }
        intensity: { type: number }
        reason: { type: string }

